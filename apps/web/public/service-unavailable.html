<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Service temporarily unavailable — HelloDeploy</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        background: #f8fafc;
        color: #172033;
      }
      main {
        max-width: 38rem;
        margin: 12vh auto;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
      }
      a {
        color: #3157d5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HelloDeploy is temporarily unavailable</h1>
      <p>
        The service could not reach the application process. Your deployed applications may be
        unaffected.
      </p>
      <p>
        Please wait a moment and <a href="/">try the dashboard again</a>. Current readiness is also
        available on the <a href="/status">status page</a>.
      </p>
    </main>
  </body>
</html>
