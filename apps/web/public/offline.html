<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — HelloDeploy</title>
    <link rel="stylesheet" href="/css/offline.css" />
    <script src="/js/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/assets/icons/icon-192.png" width="80" height="80" alt="HelloDeploy" />
      <h1>You're offline.</h1>
      <p>
        Your deployment dashboard requires an internet connection. Deployment information is
        unavailable until you reconnect.
      </p>
      <button type="button" id="offline-retry">Try Again</button>
      <p><a href="/">HelloDeploy home</a></p>
    </main>
  </body>
</html>
