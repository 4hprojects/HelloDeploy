# Catch-all for hostnames no other site claims (for example a mistyped or removed
# *.hellodeploy.online address). Installed to /etc/nginx/sites-available/default; see
# docs/OPERATIONS_RUNBOOKS.md › Host nginx sites outside HelloDeploy.
#
# It answers 404 with the branded, self-contained site-not-found page. configure-platform-ingress.sh
# publishes that page to /var/www/hellodeploy-status on every install and upgrade, because nginx
# (www-data) cannot read the checkout under /opt/hellodeploy.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hellodeploy-status;
    error_page 404 /site-not-found.html;

    location = /site-not-found.html {
        internal;
    }

    location / {
        return 404;
    }
}
