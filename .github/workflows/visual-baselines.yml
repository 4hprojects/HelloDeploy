name: Visual baselines

# Regenerates Playwright screenshot baselines on the same runner image as CI,
# so fonts and rendering match. Baselines made on a developer machine use
# different system fonts and fail CI's comparison.
# Run it from the Actions tab, download the artifact, and commit the PNGs
# into tests/browser/__screenshots__/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: Regenerate screenshot baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          # The runner's cached 22.x lags security releases (it served 22.23.3 after 22.23.4 shipped).
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      # The whole suite runs because the visual tests depend on state that
      # earlier tests create in the shared fixture server.
      - name: Regenerate baselines
        run: npm run test:browser:update

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/browser/__screenshots__
          retention-days: 14
