name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build and verify production assets
        run: npm run assets:build && npm run assets:verify && npm run assets:budget

      - name: Validate development/test configuration
        run: NODE_ENV=test npm run config:check

      - name: Test (with coverage report)
        run: npm run test:coverage

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser, accessibility, responsive, and visual tests
        run: npm run test:browser

      # Screenshots, diffs, and traces are the only way to see why a visual
      # test failed on the CI renderer; nothing is uploaded when it passes.
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/playwright
            playwright-report
          retention-days: 14

      - name: Lighthouse lab budgets
        run: npm run performance:lab

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
