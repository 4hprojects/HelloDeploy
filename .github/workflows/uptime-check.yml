name: Uptime Check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check readiness, discovery, TLS, and DNS
    runs-on: ubuntu-latest
    steps:
      - name: Check public platform surfaces
        env:
          CANARY_URL: ${{ secrets.HELLODEPLOY_CANARY_URL }}
        run: |
          set -euo pipefail
          base=https://hellodeploy.online
          for path in /ready / /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 "$base$path" >/dev/null
          done
          host hellodeploy.online >/dev/null
          expiry=$(echo | openssl s_client -servername hellodeploy.online -connect hellodeploy.online:443 2>/dev/null | openssl x509 -noout -enddate)
          test -n "$expiry"
          if [ -n "${CANARY_URL:-}" ]; then
            curl --fail --silent --show-error --max-time 15 --proto '=https' --tlsv1.2 "$CANARY_URL" >/dev/null
          else
            echo "No canary URL configured; canary gate not claimed."
          fi
